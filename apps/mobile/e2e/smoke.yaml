# V9 smoke: the app starts offline on Today, every tab opens, and the local
# database passes every query type.
appId: app.vee.mobile
---
- clearState
- setAirplaneMode: enabled
- launchApp
- runFlow: subflows/onboard-quick.yaml
- tapOn: "Plan"
- assertVisible: "Block week 1.*"
- tapOn: "Body"
- assertVisible: "Weight"
- tapOn: "Food"
- assertVisible: "Saved meals"
- tapOn: "Coach"
- assertVisible: "The coach chat needs an account, the plus tier and a connection.*"
- tapOn: "Today"
- openLink: "app.vee.mobile://dev/db"
- extendedWaitUntil:
    visible:
      id: "db-spike-summary"
      text: "Database spike: all passed"
    timeout: 20000
- setAirplaneMode: disabled
