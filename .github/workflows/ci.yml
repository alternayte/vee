# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main, "b[0-9][0-9]-*"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@v3
      - run: bun install --frozen-lockfile
      - name: V13 leak guard
        run: just leak
      - name: V14 licence headers
        run: just spdx
      - name: V1 types and lint
        run: just check
      - name: Catalogue validation
        run: just catalogue
      - name: Tests (V2–V4)
        run: just test
      - name: V5 simulation
        run: just sim

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: extractions/setup-just@v3
      - run: bun install --frozen-lockfile
      - name: V7 API against Postgres
        run: just test-api
      - name: V8 sync against Postgres and PowerSync
        run: just test-sync
      - name: API image builds
        run: docker build -f apps/api/Dockerfile -t vee-api:ci .
